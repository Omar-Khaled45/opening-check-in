<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>The Shop — Private Store Opening Invitation & Check-In</title>
		<meta
			name="description"
			content="Official invitation verification and check-in portal for The Shop private opening event."
		/>
		<meta property="og:title" content="The Shop — Private Store Opening Invitation" />
		<meta
			property="og:description"
			content="Official invitation verification and digital entry pass portal for The Shop private opening event."
		/>
		<meta property="og:type" content="website" />

		<!-- Fast Google Fonts (strictly needed weights only with display=swap) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@500;700&display=swap"
		/>
	</head>
	<body
		class="bg-shop-dark text-slate-100 min-h-screen antialiased selection:bg-shop-cream selection:text-shop-navy"
	>
		<div id="root">
			<!-- Instant visible loader while JS parses -->
			<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0e243a; color: #f4ebda; font-family: system-ui, -apple-system, sans-serif;">
				<div style="width: 44px; height: 44px; border: 3px solid rgba(244,235,218,0.2); border-top-color: #c99a45; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
				<p style="margin-top: 18px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.75; font-weight: 600;">The Shop Opening</p>
			</div>
			<style>@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}</style>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
